spring:
  application:
    name: trip-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/trip_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

app:
  kafka:
    topics:
      notification: "notification-events"
  pricing:
    fare-per-km: 50.0
  internal:
    api-key: ${INTERNAL_API_KEY:local-secret-key}
  jwt:
    secret: ${APP_JWT_SECRET:your-very-long-and-safe-secret-key-at-least-32-chars}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}

logging:
  level:
    io.github.speranskyartyom.taxi_microservices: INFO
    io.github.speranskyartyom.taxi_microservices.trip_service.client: DEBUG